appId: com.halalmap.app
---
# iOS Keychain / password save and Android autofill save dialogs after login.
- waitForAnimationToEnd
- repeat:
    times: 4
    commands:
      - tapOn:
          text: "Not Now"
          optional: true
      - tapOn:
          text: "Never"
          optional: true
      - tapOn:
          text: "No thanks"
          optional: true
      - tapOn:
          text: "Not now"
          optional: true
      - tapOn:
          text: "Don't Save"
          optional: true
      - waitForAnimationToEnd
